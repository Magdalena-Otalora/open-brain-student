name: Keep Supabase Awake

# Free Supabase projects pause after 7 days with no activity.
# This job pings the project's health check every 3 days so it never
# gets a chance to fall asleep. It's a read-only check — it doesn't
# touch any data.

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Unexpected status code from Supabase"
            exit 1
          fi
