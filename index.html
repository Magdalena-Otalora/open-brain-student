<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>My Open Brain</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
  :root{
    --bg:#0f0f0f; --card:#161616; --card2:#1c1c1c;
    --line:#2a2a2a; --text:#ededed; --dim:#8a8a8a;
    --accent:#6366f1; --accent-dim:#4f46e5;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}

  #auth{max-width:380px;margin:10vh auto;padding:0 20px;text-align:center}
  #auth h1{font-size:30px;margin-bottom:6px}
  #authTag{color:var(--dim);font-size:14px;margin-bottom:26px}
  #auth input{width:100%;margin-bottom:10px}
  .auth-toggle{margin-top:16px;font-size:14px;color:var(--dim)}
  .auth-toggle a{color:var(--accent);cursor:pointer;text-decoration:none}
  #authLang{margin-top:22px}

  header{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  header h1{font-size:22px;flex:1;min-width:140px}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
  .mini{background:none;border:1px solid var(--line);color:var(--dim);
        font-size:11px;cursor:pointer;padding:3px 8px;border-radius:6px}
  .mini:hover{color:var(--text);border-color:var(--dim)}

  nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    background:var(--card);border:1px solid var(--line);color:var(--dim);
    padding:9px 15px;border-radius:9px;cursor:pointer;font-size:14px;white-space:nowrap;
  }
  nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}

  .panel{display:none} .panel.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:13px}
  .hint{color:var(--dim);font-size:13px;margin-bottom:11px}

  textarea,input[type=text],input[type=email],input[type=password],input[type=url]{
    width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:12px;font:inherit;font-size:15px;resize:vertical;
  }
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:110px}

  button.go{
    background:var(--accent);border:none;color:#fff;padding:11px 20px;
    border-radius:9px;font-size:15px;font-weight:500;cursor:pointer;margin-top:10px;
  }
  button.go:hover{background:var(--accent-dim)}
  button.go:disabled{opacity:.5;cursor:not-allowed}

  #mic{
    width:88px;height:88px;border-radius:50%;border:none;background:var(--accent);
    color:#fff;font-size:34px;cursor:pointer;display:block;margin:6px auto 14px;
  }
  #mic.live{background:var(--bad);animation:pulse 1.4s infinite}
  #mic:disabled{opacity:.4;cursor:not-allowed;animation:none}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  #drop{border:2px dashed var(--line);border-radius:13px;padding:34px 18px;
        text-align:center;color:var(--dim);cursor:pointer}
  #drop.over{border-color:var(--accent);background:rgba(99,102,241,.07)}

  .thought{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:10px}
  .thought .meta{font-size:11px;color:var(--dim);margin-bottom:7px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .badge{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:10px}
  .badge.sim{border-color:var(--accent);color:#a5b4fc}
  .thought .body{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .thought .tags{margin-top:9px;font-size:11px;color:var(--dim)}

  .msg{padding:11px 13px;border-radius:9px;margin:11px 0;font-size:14px;display:none}
  .msg.show{display:block}
  .msg.ok{background:rgba(34,197,94,.11);border:1px solid rgba(34,197,94,.3);color:#86efac}
  .msg.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
  .msg.work{background:rgba(99,102,241,.11);border:1px solid rgba(99,102,241,.3);color:#a5b4fc}
  .msg.warn{background:rgba(245,158,11,.11);border:1px solid rgba(245,158,11,.3);color:#fcd34d}

  .empty{text-align:center;color:var(--dim);padding:34px 16px;font-size:14px}
  .count{font-size:12px;color:var(--dim);margin-bottom:11px}
</style>
</head>
<body>

<div id="auth">
  <h1>🧠 Open Brain</h1>
  <p id="authTag">Your knowledge. Your database. Your rules.</p>
  <input type="email" id="email" autocomplete="email">
  <input type="password" id="password" autocomplete="current-password">
  <button class="go" id="authBtn" style="width:100%">Sign in</button>
  <div class="msg" id="authMsg"></div>
  <div class="auth-toggle">
    <span id="authSwitchText">No account yet?</span>
    <a id="authSwitch">Create one</a>
  </div>
  <div id="authLang"><button class="mini" id="langBtn2">ES</button></div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <h1>🧠 Open Brain</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText"></span></div>
    <span class="status" id="spend" title=""></span>
    <button class="mini" id="langBtn">ES</button>
    <button class="mini" id="signout">sign out</button>
  </header>

  <nav>
    <button data-tab="write" class="active"></button>
    <button data-tab="voice"></button>
    <button data-tab="youtube"></button>
    <button data-tab="pdf"></button>
    <button data-tab="url"></button>
    <button data-tab="search"></button>
    <button data-tab="recent"></button>
  </nav>

  <section class="panel active" id="p-write">
    <div class="card">
      <div class="hint" id="writeHint"></div>
      <textarea id="writeText"></textarea>
      <button class="go" id="writeSave"></button>
      <div class="msg" id="writeMsg"></div>
    </div>
  </section>

  <section class="panel" id="p-voice">
    <div class="card">
      <div class="hint" id="voiceHint"></div>
      <div class="msg" id="voiceIOSWarn"></div>
      <button id="mic">🎙️</button>
      <textarea id="voiceText"></textarea>
      <button class="go" id="voiceSave"></button>
      <div class="msg" id="voiceMsg"></div>
    </div>
  </section>

  <section class="panel" id="p-youtube">
    <div class="card">
      <div class="hint" id="ytHint"></div>
      <input type="url" id="ytUrl" placeholder="https://www.youtube.com/watch?v=…">
      <button class="go" id="ytGo"></button>
      <div class="msg" id="ytMsg"></div>
    </div>
  </section>

  <section class="panel" id="p-pdf">
    <div class="card">
      <div class="hint" id="pdfHint"></div>
      <div id="drop">
        <div style="font-size:30px;margin-bottom:7px">📄</div>
        <div id="pdfDropText"></div>
      </div>
      <input type="file" id="pdfFile" accept="application/pdf" style="display:none">
      <textarea id="pdfText" style="margin-top:11px"></textarea>
      <button class="go" id="pdfSave"></button>
      <div class="msg" id="pdfMsg"></div>
    </div>
  </section>

  <section class="panel" id="p-url">
    <div class="card">
      <div class="hint" id="urlHint"></div>
      <input type="url" id="urlInput" placeholder="https://…">
      <button class="go" id="urlGo"></button>
      <div class="msg" id="urlMsg"></div>
    </div>
  </section>

  <section class="panel" id="p-search">
    <div class="card">
      <div class="hint" id="searchHint"></div>
      <input type="text" id="q">
      <button class="go" id="searchGo"></button>
    </div>
    <div class="msg" id="searchMsg"></div>
    <div id="searchOut"></div>
  </section>

  <section class="panel" id="p-recent">
    <div class="count" id="recentCount"></div>
    <div id="recentOut"></div>
  </section>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// ===========================================================================
// PDF.js worker — MUST match the library version above exactly.
// A mismatch (or a missing workerSrc) is the single most common reason PDF
// reading silently does nothing. If you upgrade one line, upgrade both.
// ===========================================================================
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const $ = id => document.getElementById(id);

// ===========================================================================
// LANGUAGE
// Follows the browser on first visit; the EN/ES button overrides and is
// remembered. To add a language, copy the `es` block and translate it.
// ===========================================================================

    byKeyword:n=>`${n} result${n===1?'':'s'} — matched by keyword`,

    urlWorking:'Fetching the page and summarising…',
    noCaptions:' (no captions on this video — summarised from its description)',
    ytFail:'Could not capture that video.', urlFail:'Could not capture that page.',

    micErr:e=>`Microphone error: ${e}`,

    setupBody:'<strong>config.js still has its placeholder values.</strong><br><br>Tell Claude Code: <em>"fill in config.js with my Supabase URL and public key"</em> — or edit the file yourself. Both values are in your Supabase dashboard under Project Settings → API Keys.',
  },

    tagline:'Tu conocimiento. Tu base de datos. Tus reglas.',
    email:'tu@ejemplo.com', password:'contraseña',
    signIn:'Entrar', createAccount:'Crear cuenta',
    noAccount:'¿Todavía no tienes cuenta?', haveAccount:'¿Ya tienes una?', createOne:'Crear una',
    connecting:'conectando…', connected:'conectado', dbError:'error de base de datos',
    signOut:'salir',
    tabs:['✏️ Escribir','🎙️ Voz','📹 YouTube','📄 PDF','🔗 Liga','🔍 Buscar','🕐 Recientes'],

    pdfHint:'Suelta un PDF o toca para elegir uno. El texto se lee en tu navegador — el archivo nunca sale de tu computadora.',

    searchPh:'¿Qué estás buscando?',
    save:'Guardar en el cerebro', captureVideo:'Capturar video', capturePage:'Capturar página', search:'Buscar',

    sourceExcerptBadge:'del texto completo',
    summaryExcerptBadge:'extracto',
    needBoth:'Escribe un correo y una contraseña.',
    shortPw:'La contraseña necesita al menos 6 caracteres.',
    accountMade:'Cuenta creada. Entrando…',
    confirmEmail:'Esta cuenta necesita confirmación de correo. Desactívala en Supabase → Authentication → Sign In / Providers → Email → desmarca "Confirm email", y vuelve a intentar.',

    ytWorking:'Obteniendo la transcripción y resumiendo. Esto tarda de 15 a 40 segundos.',
    urlWorking:'Obteniendo la página y resumiendo…',
    noCaptions:' (este video no tiene subtítulos — se resumió desde su descripción)',
    ytFail:'No se pudo capturar ese video.', urlFail:'No se pudo capturar esa página.',
    searchFail:'Falló la búsqueda.',
    listening:'Escuchando…',
    micBlocked:'Se bloqueó el acceso al micrófono. Permítelo en la configuración de tu navegador e intenta de nuevo.',
    micErr:e=>`Error de micrófono: ${e}`,
    noSpeech:'Este navegador no puede reconocer voz. Chrome o Edge sí funcionan.',
    iosVoiceWarning:'La voz no funciona en la aplicación instalada en iPhone — es una restricción de Apple, no algo roto aquí. Escribir, YouTube, PDF, ligas y búsqueda funcionan normal. Para usar tu voz, abre esto en Safari en su lugar, o mándale una nota de voz a tu bot de Telegram.',
    notPdf:'Eso no es un PDF.',
    pdfReading:n=>`Leyendo ${n}…`, pdfPage:(p,n)=>`Leyendo página ${p} de ${n}…`,
    pdfScanned:'Casi no se encontró texto. Probablemente es un PDF escaneado — una imagen de una página en lugar de texto real. Necesitaría pasar por un programa de OCR primero.',
    pdfDone:n=>`Se leyeron ${n} página${n===1?'':'s'}. Revísalo y guarda.`,
    pdfFail:m=>`No se pudo leer ese PDF: ${m}`,
    setupTitle:'Ya casi — esta aplicación todavía no está conectada a tu base de datos.',
    setupBody:'<strong>config.js todavía tiene sus valores de ejemplo.</strong><br><br>Dile a Claude Code: <em>"llena config.js con mi URL de Supabase y mi llave pública"</em> — o edita el archivo tú. Los dos valores están en tu panel de Supabase, en Project Settings → API Keys.',
  },
};

const saved = localStorage.getItem('ob_lang');
let lang = saved || ((navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en');
let t = T[lang];
let signingUp = false;

function applyLanguage(){
  t = T[lang] || T.en;
  document.documentElement.lang = lang;
  const txt = (id,v) => { const n=$(id); if(n) n.textContent = v; };
  const ph  = (id,v) => { const n=$(id); if(n) n.placeholder = v; };

  txt('authTag', t.tagline);
  ph('email', t.email); ph('password', t.password);
  txt('authBtn', signingUp ? t.createAccount : t.signIn);
  txt('authSwitchText', signingUp ? t.haveAccount : t.noAccount);
  txt('authSwitch', signingUp ? t.signIn : t.createOne);
  txt('signout', t.signOut);

  document.querySelectorAll('nav button').forEach((b,i) => { b.textContent = t.tabs[i]; });

  txt('writeHint', t.writeHint);   ph('writeText', t.writePh);
  txt('voiceHint', t.voiceHint);   ph('voiceText', t.voicePh);
  txt('ytHint', t.ytHint);
  txt('pdfHint', t.pdfHint);       txt('pdfDropText', t.pdfDrop); ph('pdfText', t.pdfPh);
  txt('urlHint', t.urlHint);
  txt('searchHint', t.searchHint); ph('q', t.searchPh);
  txt('writeSave', t.save); txt('voiceSave', t.save); txt('pdfSave', t.save);
  txt('ytGo', t.captureVideo); txt('urlGo', t.capturePage); txt('searchGo', t.search);

  const label = lang === 'es' ? 'EN' : 'ES';
  txt('langBtn', label); txt('langBtn2', label);
}

function toggleLanguage(){
  lang = lang === 'es' ? 'en' : 'es';
  localStorage.setItem('ob_lang', lang);
  applyLanguage();
  updateVoiceWarning();
  if (user) { loadRecent(); }
}

applyLanguage();
$('langBtn').onclick = toggleLanguage;
$('langBtn2').onclick = toggleLanguage;

// ===========================================================================
// SETUP CHECK
// Without this, an unfilled config.js throws on the very first line and the
// whole page silently stops working — a login form where nothing happens.
// ===========================================================================
const configOk =
  typeof SUPABASE_URL === 'string' && typeof SUPABASE_ANON_KEY === 'string' &&
  SUPABASE_URL.startsWith('http') &&
  !SUPABASE_URL.includes('PASTE_') && !SUPABASE_ANON_KEY.includes('PASTE_');

if (!configOk) {
  $('auth').innerHTML =
    '<h1>🧠 Open Brain</h1><p id="authTag">' + t.setupTitle + '</p>' +
    '<div class="msg show err" style="text-align:left">' + t.setupBody + '</div>';
  throw new Error('Open Brain: config.js is not filled in yet.');
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let user = null;

function say(el, text, kind='work'){
  const n = $(el); n.textContent = text; n.className = 'msg show ' + kind;
}
function clear(el){ $(el).className = 'msg'; }
function busy(btn, on, label){
  const b = $(btn); b.disabled = on;
  if (on){ b.dataset.was = b.textContent; b.textContent = label || t.saving; }
  else if (b.dataset.was){ b.textContent = b.dataset.was; }
}
async function fn(name, payload){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${session?.access_token ?? SUPABASE_ANON_KEY}`,
      'apikey': SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(payload),
  });
  return res.json();
}

// ===========================================================================
// AUTH
// ===========================================================================
$('authSwitch').onclick = () => { signingUp = !signingUp; applyLanguage(); clear('authMsg'); };

$('authBtn').onclick = async () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) return say('authMsg', t.needBoth, 'err');
  if (password.length < 6) return say('authMsg', t.shortPw, 'err');

  busy('authBtn', true);
  const { error } = signingUp
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  busy('authBtn', false);

  if (error) {
    return say('authMsg', /confirm/i.test(error.message) ? t.confirmEmail : error.message, 'err');
  }
  if (signingUp) say('authMsg', t.accountMade, 'ok');
};

$('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

sb.auth.onAuthStateChange((_e, session) => {
  user = session?.user ?? null;
  if (user) start(); else { $('auth').style.display='block'; $('app').style.display='none'; }
});

async function start(){
  $('auth').style.display = 'none';
  $('app').style.display  = 'block';
  applyLanguage();
  $('statusText').textContent = t.connecting;
  const { error } = await sb.from('thoughts').select('id', { count:'exact', head:true });
  if (error){ $('dot').className='dot off'; $('statusText').textContent=t.dbError; }
  else { $('dot').className='dot on'; $('statusText').textContent=t.connected; }
  loadSpend();
  loadRecent();
}

// ===========================================================================
// WHAT IT HAS COST
// Reads the real total from the database rather than estimating. If anything
// goes wrong here it stays silent — a missing cost figure must never look like
// a broken app.
// ===========================================================================
async function loadSpend(){
  try {
    const { data, error } = await sb.rpc('my_spend');
    if (error || !data) return;
    const row = Array.isArray(data) ? data[0] : data;
    const usd = Number(row?.month_usd ?? 0);
    const el = $('spend');
    el.textContent = usd > 0 ? t.spend(usd) : t.spendZero;
    el.title = t.spendTitle;
  } catch { /* silent by design */ }
}

// ===========================================================================
// SAVING
// ===========================================================================
async function save(content, source, metadata={}){
  // upsert, not insert: migration.sql puts a unique index on (dedup_key, user_id), auto-derived
  // from content by a database trigger. Saving the same text twice — a double-tap, a page
  // refresh that resubmits — collapses onto the existing row instead of creating a duplicate.
  const { error } = await sb.from('thoughts')
    .upsert({ user_id:user.id, content, source, metadata }, { onConflict:'dedup_key,user_id' });
  return error;
}

// VOICE
// ===========================================================================
// IOS-STANDALONE-DETECT:START
// Apple blocks the Web Speech API for web apps installed to an iPhone home
// screen — it works fine in the regular Safari tab, just not once the app is
// an icon. Written as pure functions taking nav/win explicitly (instead of
// reading the globals directly) so this exact logic can be extracted and
// unit-tested outside a browser — see tests/ios-standalone.test.ts
//
// Both checks matter, not just one:
//   navigator.standalone   — Safari's own long-standing signal. Some iOS
//                             versions/flows do not set it even when running
//                             standalone (notably iOS 26's new "Open as Web
//                             App" path).
//   display-mode: standalone — the standard, cross-browser signal, but is
//                             not consistently set on every iOS release
//                             either. Checking both catches more real cases
//                             than either alone.
function isIOSDevice(nav){
  return /iPad|iPhone|iPod/.test(nav.userAgent || '') ||
    (nav.platform === 'MacIntel' && (nav.maxTouchPoints || 0) > 1);
}
function isStandaloneDisplay(nav, win){
  return nav.standalone === true ||
    !!(win.matchMedia && win.matchMedia('(display-mode: standalone)').matches);
}
// IOS-STANDALONE-DETECT:END

const iosVoiceBlocked = isIOSDevice(navigator) && isStandaloneDisplay(navigator, window);

function updateVoiceWarning(){
  const mic = $('mic');
  if (iosVoiceBlocked){
    say('voiceIOSWarn', t.iosVoiceWarning, 'warn');
    mic.disabled = true;
    mic.title = t.iosVoiceWarning;
  } else {
    clear('voiceIOSWarn');
    mic.disabled = false;
    mic.title = '';
  }
}
updateVoiceWarning();

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

$('mic').onclick = () => {
  // Checked again here, not just via the disabled attribute above — belt and
  // braces so a click can never fall through to rec.start() and fail with no
  // explanation, which is the exact silent failure this exists to prevent.
  if (iosVoiceBlocked) return say('voiceMsg', t.iosVoiceWarning, 'warn');
  if (!SR) return say('voiceMsg', t.noSpeech, 'err');
  if (listening){ rec.stop(); return; }

  rec = new SR();
  rec.continuous = true; rec.interimResults = true;
  rec.lang = lang === 'es' ? 'es-MX' : 'en-US';
  let settled = '';

  rec.onstart = () => { listening = true; $('mic').classList.add('live'); say('voiceMsg', t.listening); };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const chunk = e.results[i][0].transcript;
      if (e.results[i].isFinal) settled += chunk + ' '; else interim += chunk;
    }
    $('voiceText').value = (settled + interim).trim();
  };
  rec.onerror = e => {
    listening = false; $('mic').classList.remove('live');
    say('voiceMsg', e.error === 'not-allowed' ? t.micBlocked : t.micErr(e.error), 'err');
  };
  rec.onend = () => { listening = false; $('mic').classList.remove('live'); clear('voiceMsg'); };
  rec.start();
};

$('voiceSave').onclick = async () => {
  const v = $('voiceText').value.trim();
  if (!v) return say('voiceMsg', t.nothingRec, 'err');
  if (listening) rec.stop();
  busy('voiceSave', true);
  const err = await save(v, 'voice');
  busy('voiceSave', false);
  if (err) return say('voiceMsg', err.message, 'err');
  $('voiceText').value = '';
  say('voiceMsg', t.savedShort, 'ok');
  loadRecent();
};

};

let pdfName = '';
async function readPdf(file){
  if (file.type !== 'application/pdf') return say('pdfMsg', t.notPdf, 'err');
  pdfName = file.name;
  say('pdfMsg', t.pdfReading(file.name));
  try {
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = '';
    for (let p = 1; p <= doc.numPages; p++){
      say('pdfMsg', t.pdfPage(p, doc.numPages));
      const page = await doc.getPage(p);
      const content = await page.getTextContent();
      out += content.items.map(i => i.str).join(' ') + '\n\n';
    }
    const text = out.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
    if (text.length < 50) return say('pdfMsg', t.pdfScanned, 'err');
    $('pdfText').value = text;
    say('pdfMsg', t.pdfDone(doc.numPages), 'ok');
  } catch (err) {
    say('pdfMsg', t.pdfFail(err.message), 'err');
  }
}

$('searchGo').onclick = runSearch;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

async function runSearch(){
  const q = $('q').value.trim();
  if (!q) return;
  busy('searchGo', true, t.searching);
  say('searchMsg', t.searching);
  $('searchOut').innerHTML = '';

  const r = await fn('search-brain', { query: q, limit: 20 });

  busy('searchGo', false);
  if (!r.ok) return say('searchMsg', r.error || t.searchFail, 'err');
  clear('searchMsg');

  if (!r.results?.length){
    $('searchOut').innerHTML = `<div class="empty">${escapeHtml(t.noMatch(q))}</div>`;
    return;
  }
  const label = r.mode === 'hybrid' ? t.byMeaning(r.count) : t.byKeyword(r.count);
  $('searchOut').innerHTML = `<div class="count">${label}</div>` + r.results.map(render).join('');
}

// ===========================================================================
// RECENT
// ===========================================================================
async function loadRecent(){
  const { data, error, count } = await sb.from('thoughts')
    .select('id,content,source,category,tags,created_at', { count:'exact' })
    .order('created_at', { ascending:false })
    .limit(25);

  if (error){ $('recentOut').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`; return; }
  $('recentCount').textContent = count ? t.count(count) : '';
  $('recentOut').innerHTML = data?.length
    ? data.map(render).join('')
    : `<div class="empty">${t.emptyBrain}</div>`;

  // Refresh the spend figure too — loadRecent runs after every save, so this
  // keeps the number current instead of only updating on a page reload.
  loadSpend();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(x){
  const when = new Date(x.created_at).toLocaleString(lang === 'es' ? 'es-MX' : undefined,
    { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  const badges = [];
  if (x.source && x.source !== 'text') badges.push(`<span class="badge">${escapeHtml(x.source)}</span>`);
  if (x.category) badges.push(`<span class="badge">${escapeHtml(x.category)}</span>`);
  // 0 means "matched by keyword only, no meaning-fingerprint score" — not "0% relevant".
  if (typeof x.similarity === 'number' && x.similarity > 0)
    badges.push(`<span class="badge sim">${Math.round(x.similarity*100)}%</span>`);
  // match_source/chunk_origin are only present on search results, never on the Recent list.
  // 'chunk' means the match came from a specific passage, not the thought's own whole-content
  // vector. Which ORIGIN that passage came from matters more than the word "chunk" does: a
  // 'summary' chunk is a fragment of the text already shown below, but a 'source' chunk is a
  // passage from the full article/transcript that is NOT shown here — without this label, a hit
  // whose match text is invisible looks unexplained.
  if (x.match_source === 'chunk') {
    badges.push(`<span class="badge">${escapeHtml(
      x.chunk_origin === 'source' ? t.sourceExcerptBadge : t.summaryExcerptBadge
    )}</span>`);
  }
  const tags = x.tags?.length
    ? `<div class="tags">${x.tags.map(v => '#' + escapeHtml(v)).join(' ')}</div>` : '';
  return `<div class="thought">
      <div class="meta"><span>${when}</span>${badges.join('')}</div>
      <div class="body">${escapeHtml(x.content)}</div>${tags}
    </div>`;
}
